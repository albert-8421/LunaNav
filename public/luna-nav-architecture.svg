<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 820" role="img" aria-labelledby="title desc">
  <title id="title">LUNA NAV technical architecture and data flow</title>
  <desc id="desc">A diagram showing user selections flowing through the Next.js browser interface and server API route to NASA JPL Horizons, then returning to client-side calculations and dashboard visualizations. Sample preview and reference sites are local inputs.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#967044"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#34788c"/></marker>
    <style>
      .label{font:600 12px 'Segoe UI',Arial,sans-serif;letter-spacing:1.7px;fill:#8b632c}
      .card{fill:#fffefa;stroke:#dedbd1;stroke-width:1.5}
      .card-title{font:600 18px 'Segoe UI',Arial,sans-serif;fill:#27353a}
      .card-kicker{font:600 10px 'Segoe UI',Arial,sans-serif;letter-spacing:1.2px;fill:#9b702f}
      .body{font:13px 'Segoe UI',Arial,sans-serif;fill:#59676a}
      .small{font:11px 'Segoe UI',Arial,sans-serif;fill:#727d7d}
      .step{font:600 12px 'Segoe UI',Arial,sans-serif;fill:#9b702f}
      .arrow-label{font:11px 'Segoe UI',Arial,sans-serif;fill:#6f6c5f}
    </style>
  </defs>
  <rect width="1440" height="820" rx="8" fill="#f8f6f0"/>
  <path d="M0 0h1440v10H0z" fill="#b67b2d"/>
  <text x="52" y="56" class="label">LUNA NAV · TECHNICAL ARCHITECTURE</text>
  <text x="52" y="82" class="small">A single Next.js application. Live ephemeris comes from JPL Horizons; sample mode stays in the browser.</text>

  <text x="52" y="132" class="label">LIVE DATA REQUEST</text>
  <path d="M52 145H1388" stroke="#dedbd1"/>

  <g>
    <rect x="52" y="175" width="245" height="215" rx="4" class="card"/>
    <text x="72" y="205" class="step">01 · INPUT</text>
    <text x="72" y="235" class="card-title">Mission planner</text>
    <text x="72" y="263" class="body"><tspan x="72" dy="0">Choose a lunar reference site</tspan><tspan x="72" dy="21">or enter coordinates, then set</tspan><tspan x="72" dy="21">the local start time, window,</tspan><tspan x="72" dy="21">and sample interval.</tspan></text>
    <text x="72" y="367" class="small">Local time is converted to UTC.</text>
  </g>

  <g>
    <rect x="350" y="175" width="370" height="215" rx="4" class="card"/>
    <text x="370" y="205" class="step">02 · BROWSER</text>
    <text x="370" y="235" class="card-title">Next.js App Router UI</text>
    <text x="370" y="263" class="body"><tspan x="370" dy="0">Controls · SVG sky · Recharts timeline</tspan><tspan x="370" dy="21">Scenario comparison · 3D lunar explorer</tspan></text>
    <rect x="370" y="323" width="326" height="43" rx="3" fill="#f6f0e3" stroke="#e4dac6"/>
    <text x="384" y="341" class="card-kicker">LOCAL REFERENCE DATA</text>
    <text x="384" y="357" class="small">Candidate coordinates are stored in JSON.</text>
  </g>

  <g>
    <rect x="775" y="175" width="285" height="215" rx="4" class="card"/>
    <text x="795" y="205" class="step">03 · SERVER</text>
    <text x="795" y="235" class="card-title">Next.js API route</text>
    <text x="795" y="263" class="body"><tspan x="795" dy="0">/api/ephemeris</tspan><tspan x="795" dy="21">Validates time and coordinates.</tspan><tspan x="795" dy="21">Normalizes east longitude and</tspan><tspan x="795" dy="21">requests Sun and Earth samples.</tspan></text>
    <text x="795" y="367" class="small">Short-lived cache · retries · error state</text>
  </g>

  <g>
    <rect x="1115" y="175" width="273" height="215" rx="4" class="card"/>
    <text x="1135" y="205" class="step">04 · NASA DATA</text>
    <text x="1135" y="235" class="card-title">JPL Horizons API</text>
    <text x="1135" y="263" class="body"><tspan x="1135" dy="0">Sun target 10 · Earth target 399</tspan><tspan x="1135" dy="21">Observer centered on the Moon</tspan><tspan x="1135" dy="21">at the selected lunar coordinates</tspan></text>
    <text x="1135" y="347" class="small">Apparent, airless directions</text>
    <text x="1135" y="365" class="small">with azimuth, elevation and range</text>
  </g>

  <path d="M297 282h43" stroke="#967044" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="304" y="268" class="arrow-label">settings</text>
  <path d="M720 282h48" stroke="#967044" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="720" y="268" class="arrow-label">fetch</text>
  <path d="M1060 282h48" stroke="#967044" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="1062" y="268" class="arrow-label">HTTPS</text>
  <path d="M1115 374H1080V416H905V395" fill="none" stroke="#34788c" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow-blue)"/>
  <text x="1022" y="433" class="arrow-label">time-series response</text>

  <text x="52" y="475" class="label">CALCULATE · PRESENT · COMPARE</text>
  <path d="M52 488H1388" stroke="#dedbd1"/>

  <g>
    <rect x="52" y="520" width="310" height="205" rx="4" class="card"/>
    <text x="72" y="550" class="step">SAMPLE MODE</text>
    <text x="72" y="580" class="card-title">Illustrative preview</text>
    <text x="72" y="608" class="body"><tspan x="72" dy="0">Generated locally for exploring</tspan><tspan x="72" dy="21">the controls and comparison views.</tspan><tspan x="72" dy="21">It does not call NASA and is not</tspan><tspan x="72" dy="21">a prediction.</tspan></text>
    <text x="72" y="697" class="small">Never substituted after a live-data error.</text>
  </g>

  <g>
    <rect x="415" y="520" width="390" height="205" rx="4" class="card"/>
    <text x="435" y="550" class="step">CLIENT CALCULATIONS · lib/science.ts</text>
    <text x="435" y="580" class="card-title">Turn samples into measures</text>
    <text x="435" y="608" class="body"><tspan x="435" dy="0">Match Sun and Earth timestamps.</tspan><tspan x="435" dy="21">Interpolate visibility intervals and</tspan><tspan x="435" dy="21">duration; find maximum and average</tspan><tspan x="435" dy="21">elevation for each scenario.</tspan></text>
    <text x="435" y="697" class="small">Thresholds and assumptions are documented.</text>
  </g>

  <g>
    <rect x="860" y="520" width="528" height="205" rx="4" class="card"/>
    <text x="880" y="550" class="step">RESULTS IN THE BROWSER</text>
    <text x="880" y="580" class="card-title">See the geometry and trade-offs</text>
    <text x="880" y="608" class="body"><tspan x="880" dy="0">SVG sky view · elevation timeline · visibility bars</tspan><tspan x="880" dy="21">Three independent site/date scenarios and their metrics</tspan><tspan x="880" dy="21">Source labels, errors, and limits stay visible to the user.</tspan></text>
    <rect x="880" y="680" width="220" height="25" rx="2" fill="#edf4f5"/>
    <text x="892" y="697" class="small">No terrain obstruction model</text>
    <rect x="1110" y="680" width="250" height="25" rx="2" fill="#f6f0e3"/>
    <text x="1122" y="697" class="small">No power or radio-link budget</text>
  </g>

  <path d="M920 390v116H610v8" fill="none" stroke="#34788c" stroke-width="2" marker-end="url(#arrow-blue)"/>
  <text x="768" y="503" class="arrow-label">validated ephemeris</text>
  <path d="M362 623h45" stroke="#967044" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="363" y="610" class="arrow-label">sample path</text>
  <path d="M805 623h48" stroke="#967044" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="805" y="610" class="arrow-label">metrics</text>
  <text x="52" y="778" class="small">One Next.js app · TypeScript calculations · SVG / Recharts / Three.js views · JSON site metadata · no database or separate backend</text>
</svg>
